name: hevenops

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hevenops}
      POSTGRES_USER: ${DB_USER:-hevenops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [app]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "scripts/migrate.js", "up"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-hevenops}
      DB_USER: ${DB_USER:-hevenops}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SSL: ${DB_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
    networks: [app]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-hevenops}
      DB_USER: ${DB_USER:-hevenops}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SSL: ${DB_SSL:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-10000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      WORKER_HEARTBEAT_TIMEOUT_MS: ${WORKER_HEARTBEAT_TIMEOUT_MS:-90000}
      ERROR_TRACKING_WEBHOOK_URL: ${ERROR_TRACKING_WEBHOOK_URL:-}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [app]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "worker.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-hevenops}
      DB_USER: ${DB_USER:-hevenops}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SSL: ${DB_SSL:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-10000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-2000}
      JOB_LEASE_MS: ${JOB_LEASE_MS:-60000}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
      JOB_RETRY_BASE_MS: ${JOB_RETRY_BASE_MS:-5000}
      RENT_REMINDER_LEAD_DAYS: ${RENT_REMINDER_LEAD_DAYS:-3}
      WORKER_METRICS_PORT: 9100
      WORKER_HEARTBEAT_TIMEOUT_MS: ${WORKER_HEARTBEAT_TIMEOUT_MS:-90000}
      ERROR_TRACKING_WEBHOOK_URL: ${ERROR_TRACKING_WEBHOOK_URL:-}
    expose: ["9100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9100/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [app]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
